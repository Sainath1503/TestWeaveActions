name: VeyraAI Test Suite Runner

on:
  workflow_dispatch:
    inputs:
      suite_file:
        description: Test suite workbook path
        required: true
        default: testweave/test-suite.xlsx
      parallel:
        description: Enable VeyraAI parallel execution
        required: true
        default: 'false'
      threads:
        description: VeyraAI thread count
        required: true
        default: '1'

jobs:
  testweave:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java with Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: pom.xml
      - name: Check VeyraAI suite file
        run: |
          test -f "${{ inputs.suite_file }}"
          ls -l "${{ inputs.suite_file }}"
      - name: Compile VeyraAI runner
        run: >-
          mvn --batch-mode --no-transfer-progress
          -DskipTests -DskipCodexBundle=true
          compile dependency:copy-dependencies
          -DincludeScope=runtime
          -DoutputDirectory=target/dependency
      - name: Run VeyraAI suite in Docker Compose
        env:
          SUITE_FILE: ${{ inputs.suite_file }}
          TESTWEAVE_PARALLEL: ${{ inputs.parallel }}
          TESTWEAVE_THREADS: ${{ inputs.threads }}
          TESTWEAVE_HTTP_TIMEOUT_MS: '30000'
          TESTWEAVE_WEB_TIMEOUT_MS: '15000'
        run: |
          trap 'docker compose -f docker-compose.testweave.yml down --remove-orphans' EXIT
          docker compose -f docker-compose.testweave.yml up --abort-on-container-exit --exit-code-from testweave
      - name: Upload VeyraAI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testweave-report
          path: target/testweave-report/**
